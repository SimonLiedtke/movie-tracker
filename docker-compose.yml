services:
  postgres:
    image: postgres:17-alpine
    container_name: movie-tracker-postgres
    environment:
      POSTGRES_DB: movie_tracker
      POSTGRES_USER: movie_tracker
      POSTGRES_PASSWORD: movie_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_tracker -d movie_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
