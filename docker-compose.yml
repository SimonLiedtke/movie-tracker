# The whole app: PostgreSQL and the API, which also serves the Angular frontend.
#
#   docker compose up --build      everything, at http://localhost:8080
#   docker compose up -d postgres  only the database, for development with dotnet run and ng serve
#
# Secrets (Google sign-in, TMDB) are read from a .env file next to this one, see .env.example.

services:
  postgres:
    image: postgres:17-alpine
    container_name: movie-tracker-postgres
    environment:
      POSTGRES_DB: movie_tracker
      POSTGRES_USER: movie_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movie_tracker}
    ports:
      # For local development and tools like psql. The other services use the internal network.
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_tracker -d movie_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    # The API, which also serves the Angular frontend (see Dockerfile).
    build: .
    container_name: movie-tracker-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MovieTracker: Host=postgres;Port=5432;Database=movie_tracker;Username=movie_tracker;Password=${POSTGRES_PASSWORD:-movie_tracker}
      Database__MigrateOnStartup: "true"
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Tmdb__AccessToken: ${TMDB_ACCESS_TOKEN:-}
      Tmdb__Language: ${TMDB_LANGUAGE:-en-US}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
