name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # The API integration tests start PostgreSQL 17 with Testcontainers,
      # which uses the Docker daemon available on ubuntu-latest runners.
      - name: Test
        run: >
          dotnet test --no-build
          --coverage --coverage-output-format cobertura
          --results-directory coverage/raw

      # Merges the coverage of the three test projects (production code only: no tests, no
      # EF migrations, no generated OpenAPI glue) and shows it on the workflow run's summary page.
      - name: Coverage report
        run: |
          dotnet tool restore
          dotnet reportgenerator \
            "-reports:coverage/raw/**/*.cobertura.xml" \
            "-targetdir:coverage/report" \
            "-reporttypes:MarkdownSummaryGithub;HtmlInline_AzurePipelines;Cobertura" \
            "-assemblyfilters:+MovieTracker.*;-MovieTracker.*.Tests;-MovieTracker.TestSupport" \
            "-classfilters:-MovieTracker.Infrastructure.Persistence.Migrations.*;-Microsoft.AspNetCore.OpenApi.Generated"
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: backend-coverage
          path: backend/coverage/report

      # Room for a later step: compare the generated OpenAPI document
      # (/openapi/v1.json) with api/openapi.yaml.

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/angular
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Test
        run: npx ng test --watch=false

  frontend-vue:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/vue
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/vue/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Type-checks with vue-tsc, then builds with Vite.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
