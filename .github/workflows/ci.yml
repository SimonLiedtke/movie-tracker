name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To post the coverage comparison as a comment on pull requests.
      pull-requests: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # The API integration tests start PostgreSQL 17 with Testcontainers,
      # which uses the Docker daemon available on ubuntu-latest runners.
      - name: Test
        run: >
          dotnet test --no-build
          --coverage --coverage-output-format cobertura
          --results-directory coverage/raw

      # Merges the coverage of the three test projects (production code only: no tests, no
      # EF migrations, no generated OpenAPI glue) and shows it on the workflow run's summary page.
      - name: Coverage report
        run: |
          dotnet tool restore
          dotnet reportgenerator \
            "-reports:coverage/raw/**/*.cobertura.xml" \
            "-targetdir:coverage/report" \
            "-reporttypes:MarkdownSummaryGithub;HtmlInline_AzurePipelines;Cobertura;JsonSummary" \
            "-assemblyfilters:+MovieTracker.*;-MovieTracker.*.Tests;-MovieTracker.TestSupport" \
            "-classfilters:-MovieTracker.Infrastructure.Persistence.Migrations.*;-Microsoft.AspNetCore.OpenApi.Generated"
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: backend-coverage
          path: backend/coverage/report

      # The coverage of main is the baseline for pull requests. It is kept in the Actions cache:
      # pull requests can read caches that were saved on the default branch.
      - name: Save coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p coverage/baseline
          cp coverage/report/Summary.json coverage/baseline/Summary.json

      - name: Cache coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: backend/coverage/baseline
          key: backend-coverage-baseline-${{ github.sha }}

      - name: Restore coverage baseline of main
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: backend/coverage/baseline
          # No exact match is wanted: take the newest baseline.
          key: backend-coverage-baseline-none-${{ github.run_id }}
          restore-keys: backend-coverage-baseline-

      # Informational only: neither this step nor the next one can fail the build,
      # whatever the coverage is.
      - name: Compare coverage with main
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          python3 ../.github/scripts/coverage_comment.py \
            coverage/report/Summary.json coverage/baseline/Summary.json > coverage/comparison.md
          cat coverage/comparison.md >> "$GITHUB_STEP_SUMMARY"

      # The token of pull requests from forks and from Dependabot is read-only, so they only get the summary above.
      - name: Comment coverage on the pull request
        if: >
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          comments="repos/$GITHUB_REPOSITORY/issues"
          # Update the comment of an earlier run instead of adding a new one on every push.
          existing=$(gh api "$comments/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- backend-coverage-report -->"))) | .id' \
            | head -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "$comments/comments/$existing" -F body=@coverage/comparison.md
          else
            gh api --method POST "$comments/$PR_NUMBER/comments" -F body=@coverage/comparison.md
          fi

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Validates api/openapi.yaml against the OpenAPI 3.0 schema and lints it
      # with the rules in api/redocly.yaml.
      - name: Lint OpenAPI document
        run: npx --yes @redocly/cli@2 lint openapi.yaml --config redocly.yaml --format github-actions

  # The contract (api/openapi.yaml) and the code must not drift apart: the OpenAPI document that the
  # running API generates (/openapi/v1.json) is compared with it.
  openapi-contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: movie_tracker
          POSTGRES_USER: movie_tracker
          POSTGRES_PASSWORD: movie_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U movie_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The generated document is only served in the Development environment, which also applies the migrations.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5080
      ConnectionStrings__MovieTracker: Host=localhost;Port=5432;Database=movie_tracker;Username=movie_tracker;Password=movie_tracker
      # Dummy credentials: enough to register the Google handler.
      Authentication__Google__ClientId: ci-client-id
      Authentication__Google__ClientSecret: ci-client-secret
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Build
        run: dotnet build backend/src/MovieTracker.Api

      - name: Start the API
        run: |
          dotnet run --project backend/src/MovieTracker.Api --no-build --no-launch-profile > api.log 2>&1 &

      # Waits (up to about a minute) until the API is up and has applied the migrations.
      - name: Fetch the generated OpenAPI document
        run: >
          curl --silent --show-error --fail
          --retry 30 --retry-delay 2 --retry-connrefused
          --output generated-openapi.json
          http://127.0.0.1:5080/openapi/v1.json

      - name: Compare with api/openapi.yaml
        run: python3 .github/scripts/openapi_contract.py api/openapi.yaml generated-openapi.json

      - name: API log
        if: failure()
        run: cat api.log

      - name: Upload generated OpenAPI document
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: generated-openapi
          path: generated-openapi.json
          if-no-files-found: ignore

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/angular
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Test
        run: npx ng test --watch=false

  frontend-vue:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/vue
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/vue/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Type-checks with vue-tsc, then builds with Vite.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  frontend-blazor:
    name: Frontend (Blazor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/blazor
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: frontend/blazor/global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

      # The published (trimmed) app can break where the debug build does not.
      - name: Publish
        run: dotnet publish src/MovieTracker.Blazor -c Release --no-restore -o publish
