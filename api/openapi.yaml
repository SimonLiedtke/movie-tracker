openapi: 3.0.3
info:
  title: Movie Tracker API
  version: 0.1.0
  description: |
    Personal movie tracker: movies, genres, diary, watchlist.

    Movies are one of two kinds:
    - From TMDB (`tmdbId` set): imported with `POST /api/movies/tmdb/{tmdbId}`, shared by all users, read-only.
    - Added manually (`tmdbId` null): private to the user who added it, who can edit and delete it.
      Other users get 404 for it, as if it did not exist.

    Diary entries and watchlist items belong to the signed-in user.

    Conventions:
    - Errors are returned as ProblemDetails (RFC 9457) with `application/problem+json`.
    - Ratings are integers from 1 to 10 (equivalent to 0.5 to 5 stars).
    - Dates use ISO 8601 (`date` or `date-time` in UTC).
servers:
  - url: http://localhost:5080
    description: Local development

# Signing in happens with Google via /api/auth/login (not part of this document), which sets the session cookie.
# Requests that change data must also send the header `X-CSRF: 1`.
security:
  - session: []

tags:
  - name: Movies
    description: Movies from TMDB and manually added movies
  - name: Genres
    description: Genre master data
  - name: Diary
    description: Diary of viewings including ratings and reviews
  - name: Watchlist
    description: Movies to watch later
  - name: Import
    description: Import of the diary and watchlist from other services

paths:
  /api/movies:
    get:
      tags: [Movies]
      operationId: listMovies
      summary: List the user's movies
      description: |
        The movies the user has added manually, logged in the diary or put on the watchlist.
        To find other movies, use `/api/movies/search`.
      parameters:
        - name: search
          in: query
          description: Full-text search in title and original title
          schema: { type: string, maxLength: 200 }
        - name: genreId
          in: query
          schema: { type: integer, format: int32 }
        - name: year
          in: query
          description: Release year
          schema: { type: integer, format: int32, minimum: 1870, maximum: 2100 }
        - name: sort
          in: query
          description: Sort order; a leading minus means descending.
          schema:
            type: string
            enum: [title, -title, releaseDate, -releaseDate, createdAt, -createdAt]
            default: title
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of movies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovieSummaryPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Movies]
      operationId: createMovie
      summary: Add a movie manually
      description: For movies that TMDB does not know. Only the signed-in user sees the movie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovieInput' }
      responses:
        '201':
          description: Movie created
          headers:
            Location:
              description: URL of the new movie
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/movies/search:
    get:
      tags: [Movies]
      operationId: searchMovies
      summary: Find movies to log or watchlist
      description: |
        The user's manually added movies first (at most 10), then the first page of TMDB's results.
        If TMDB is not configured or not reachable, only manual movies are returned and `tmdbAvailable` is false.
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovieSearchResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/movies/tmdb/{tmdbId}:
    parameters:
      - name: tmdbId
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 1 }
    post:
      tags: [Movies]
      operationId: importTmdbMovie
      summary: Import a movie from TMDB (idempotent)
      description: |
        Makes a TMDB movie available for diary and watchlist.
        Returns the existing movie if it was imported before (also by another user).
      responses:
        '200':
          description: The movie was imported before
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '201':
          description: Movie imported
          headers:
            Location:
              description: URL of the new movie
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '404':
          description: TMDB has no movie with this ID.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '502':
          description: TMDB could not be reached or answered with an error.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '503':
          description: The server has no TMDB access token.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/movies/{movieId}:
    parameters:
      - $ref: '#/components/parameters/MovieId'
    get:
      tags: [Movies]
      operationId: getMovie
      summary: Get a movie
      responses:
        '200':
          description: The movie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Movies]
      operationId: updateMovie
      summary: Replace a manually added movie
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovieInput' }
      responses:
        '200':
          description: Updated movie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ReadOnlyMovie' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Movies]
      operationId: deleteMovie
      summary: Delete a manually added movie
      description: |
        Fails with 409 as long as diary entries exist for this movie,
        so the viewing history is not lost by accident.
        A watchlist entry is deleted along with the movie.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/ReadOnlyMovie' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Movie still has diary entries.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/movies/{movieId}/diary-entries:
    parameters:
      - $ref: '#/components/parameters/MovieId'
    get:
      tags: [Movies, Diary]
      operationId: listMovieDiaryEntries
      summary: List all viewings of a movie, newest first
      responses:
        '200':
          description: Diary entries of the movie
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DiaryEntry' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/genres:
    get:
      tags: [Genres]
      operationId: listGenres
      summary: List all genres, alphabetically
      responses:
        '200':
          description: Genres
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Genre' }

  /api/diary-entries:
    get:
      tags: [Diary]
      operationId: listDiaryEntries
      summary: List diary entries, newest viewing first
      parameters:
        - name: from
          in: query
          description: Earliest viewing date (inclusive)
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Latest viewing date (inclusive)
          schema: { type: string, format: date }
        - name: movieId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of diary entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryEntryPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Diary]
      operationId: createDiaryEntry
      summary: Log a viewing
      description: |
        The movie has been watched, so it is removed from the user's watchlist (if it is on it) in the same
        operation. Changing a viewing later does not touch the watchlist.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryEntryInput' }
      responses:
        '201':
          description: Entry created
          headers:
            Location:
              description: URL of the new entry
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryEntry' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422':
          description: The referenced movie does not exist.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/diary-entries/{entryId}:
    parameters:
      - name: entryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Diary]
      operationId: getDiaryEntry
      summary: Get a diary entry
      responses:
        '200':
          description: The entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Diary]
      operationId: updateDiaryEntry
      summary: Replace a diary entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryEntryInput' }
      responses:
        '200':
          description: Updated entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryEntry' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The referenced movie does not exist.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
    delete:
      tags: [Diary]
      operationId: deleteDiaryEntry
      summary: Delete a diary entry
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/watchlist:
    get:
      tags: [Watchlist]
      operationId: listWatchlist
      summary: List the watchlist, most recently added first
      description: |
        With `genreId`, only movies that have any or all of these genres are listed (see `genreMatch`).
        With `releasedFrom` and/or `releasedTo`, only movies released in this period are listed.
        All filters apply together.
        `totalCount` counts the matching items only; `unfilteredCount` all items.
      parameters:
        - name: genreId
          in: query
          description: |
            Filter by genre; repeat the parameter to filter by several genres (`genreId=27&genreId=878`).
            Genres that do not exist are not an error: no movie has them.
          style: form
          explode: true
          schema:
            type: array
            items: { type: integer, format: int32 }
        - name: genreMatch
          in: query
          description: |
            How several `genreId`s are combined: `any` lists movies with at least one of the genres,
            `all` only movies that have every one of them. Without `genreId` it has no effect.
          schema:
            type: string
            enum: [any, all]
            default: any
        - name: releasedFrom
          in: query
          description: |
            Only movies released on or after this day (inclusive).
            Movies without a release date are left out when `releasedFrom` or `releasedTo` is set.
          schema: { type: string, format: date }
        - name: releasedTo
          in: query
          description: Only movies released on or before this day (inclusive). Must not be before `releasedFrom`.
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of the watchlist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchlistItemPage' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/watchlist/{movieId}:
    parameters:
      - $ref: '#/components/parameters/MovieId'
    put:
      tags: [Watchlist]
      operationId: putWatchlistItem
      summary: Add a movie to the watchlist (idempotent)
      description: |
        Creates the entry or updates its note.
        `addedAt` stays unchanged on update.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WatchlistItemInput' }
      responses:
        '200':
          description: Existing entry updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchlistItem' }
        '201':
          description: Entry created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchlistItem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Watchlist]
      operationId: deleteWatchlistItem
      summary: Remove a movie from the watchlist
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/imports/letterboxd:
    post:
      tags: [Import]
      operationId: startLetterboxdImport
      summary: Import the diary and watchlist from a Letterboxd export
      description: |
        Upload the ZIP archive from Letterboxd (Settings -> Data -> Export Your Data), as it is, without unpacking it.
        Only `diary.csv`, `reviews.csv`, `likes/films.csv` and `watchlist.csv` in its root are read; nothing of the
        upload is stored.

        The export names films without TMDB IDs, so each film is mapped to a movie: first a movie the user can use
        already (same title and release year, give or take one year), then the match on TMDB (title and year), then,
        if TMDB does not know the film, a manual movie. A film is left out if TMDB fails for it
        (`failedFilms` of the result).
        Viewings are imported with date, rating, rewatch flag and review; `liked` is set for all viewings of a film that
        Letterboxd marks as liked. Watchlist items get the date they were added on Letterboxd.

        This takes a while for a big diary, so the import runs in the background: the response is 202 with the
        job, whose progress `GET /api/imports/letterboxd/{importId}` returns. Importing the same export again is safe:
        viewings (same movie, same day) and watchlist items that exist are skipped.
        Imports are kept in memory, so they are gone after a server restart. Uploading the file again picks up where the import
        left off.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The ZIP archive from Letterboxd, at most 10 MB.
      responses:
        '202':
          description: The import has been started
          headers:
            Location:
              description: URL of the import
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '400':
          description: |
            The file is missing, larger than 10 MB, or not a ZIP archive with a Letterboxd export.
            The reason is in `errors`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblemDetails' }
        '409':
          description: The user has an import that has not finished.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/imports/letterboxd/{importId}:
    parameters:
      - name: importId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Import]
      operationId: getLetterboxdImport
      summary: Get the progress or the result of an import
      description: |
        Poll this while `status` is `running`. Other users' imports, and imports from before a server restart,
        are answered with 404.
      responses:
        '200':
          description: The import
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    MovieId:
      name: movieId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, format: int32, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 20 }

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: movie_tracker_session

  responses:
    ReadOnlyMovie:
      description: Movies from TMDB cannot be edited or deleted.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ValidationError:
      description: Invalid input
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblemDetails' }

  schemas:
    Genre:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int32 }
        name: { type: string }

    MovieRef:
      type: object
      description: Compact movie reference for embedded representations
      required: [id, title]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        releaseDate: { type: string, format: date, nullable: true }
        posterUrl: { type: string, format: uri, nullable: true }

    MovieSummary:
      type: object
      required: [id, title, genres, watchCount, onWatchlist]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        releaseDate: { type: string, format: date, nullable: true }
        posterUrl: { type: string, format: uri, nullable: true }
        genres:
          type: array
          items: { $ref: '#/components/schemas/Genre' }
        latestRating:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          nullable: true
          description: Rating (1-10) from the most recent diary entry that has a rating
        watchCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of diary entries
        onWatchlist: { type: boolean }

    Movie:
      allOf:
        - $ref: '#/components/schemas/MovieSummary'
        - type: object
          required: [createdAt]
          properties:
            originalTitle: { type: string, nullable: true }
            runtimeMinutes: { type: integer, format: int32, minimum: 1, nullable: true }
            overview: { type: string, nullable: true }
            tmdbId:
              type: integer
              format: int32
              nullable: true
              description: Set for movies from TMDB. Null for manually added movies.
            lastWatchedOn: { type: string, format: date, nullable: true }
            createdAt: { type: string, format: date-time }

    MovieInput:
      type: object
      required: [title, genreIds]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        originalTitle: { type: string, maxLength: 300, nullable: true }
        releaseDate: { type: string, format: date, nullable: true }
        runtimeMinutes: { type: integer, format: int32, minimum: 1, maximum: 1500, nullable: true }
        overview: { type: string, maxLength: 5000, nullable: true }
        posterUrl: { type: string, format: uri, maxLength: 2000, nullable: true }
        genreIds:
          type: array
          uniqueItems: true
          items: { type: integer, format: int32 }

    MovieSearchResult:
      type: object
      description: |
        One of the user's manually added movies (`movieId` set, `tmdbId` null) or a TMDB movie
        (`tmdbId` set; `movieId` only if it was imported before, otherwise import it first).
      required: [title]
      properties:
        movieId: { type: string, format: uuid, nullable: true }
        tmdbId: { type: integer, format: int32, nullable: true }
        title: { type: string }
        originalTitle: { type: string, nullable: true }
        releaseDate: { type: string, format: date, nullable: true }
        posterUrl: { type: string, format: uri, nullable: true }

    MovieSearchResponse:
      type: object
      required: [items, tmdbAvailable]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MovieSearchResult' }
        tmdbAvailable:
          type: boolean
          description: False if TMDB is not configured or could not be reached.

    DiaryEntry:
      type: object
      required: [id, movie, watchedOn, isRewatch, liked, createdAt]
      properties:
        id: { type: string, format: uuid }
        movie: { $ref: '#/components/schemas/MovieRef' }
        watchedOn: { type: string, format: date }
        rating:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          nullable: true
          description: Rating in half stars (1 = 0.5 stars, 10 = 5 stars)
        review: { type: string, nullable: true }
        isRewatch: { type: boolean }
        liked: { type: boolean }
        createdAt: { type: string, format: date-time }

    DiaryEntryInput:
      type: object
      required: [movieId, watchedOn]
      additionalProperties: false
      properties:
        movieId: { type: string, format: uuid }
        watchedOn:
          type: string
          format: date
          description: Must not be in the future.
        rating:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          nullable: true
          description: Rating in half stars (1 = 0.5 stars, 10 = 5 stars)
        review: { type: string, maxLength: 20000, nullable: true }
        isRewatch: { type: boolean, default: false }
        liked: { type: boolean, default: false }

    WatchlistItem:
      type: object
      required: [movie, addedAt, genres]
      properties:
        movie: { $ref: '#/components/schemas/MovieRef' }
        addedAt: { type: string, format: date-time }
        note: { type: string, nullable: true }
        genres:
          type: array
          description: The movie's genres, alphabetically
          items: { $ref: '#/components/schemas/Genre' }

    WatchlistItemInput:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 500, nullable: true }

    PageMetadata:
      type: object
      required: [page, pageSize, totalCount]
      properties:
        page: { type: integer, format: int32 }
        pageSize: { type: integer, format: int32 }
        totalCount: { type: integer, format: int32 }

    MovieSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/MovieSummary' }

    DiaryEntryPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/DiaryEntry' }

    WatchlistItemPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items, unfilteredCount]
          properties:
            unfilteredCount:
              type: integer
              format: int32
              description: |
                The number of items on the watchlist, whatever the filter (`totalCount` counts the matching ones).
                Shows how selective the filter is.
            items:
              type: array
              items: { $ref: '#/components/schemas/WatchlistItem' }

    ProblemDetails:
      type: object
      description: RFC 9457
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, format: int32 }
        detail: { type: string }
        instance: { type: string }

    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              description: Field name -> error messages
              additionalProperties:
                type: array
                items: { type: string }

    ImportJob:
      type: object
      required: [id, status, filmsTotal, filmsProcessed]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [running, completed, failed]
          description: '`running` also covers waiting for another import to finish.'
        filmsTotal:
          type: integer
          format: int32
          description: The number of different films in the diary and the watchlist. 0 until the import has started.
        filmsProcessed:
          type: integer
          format: int32
          description: How many of the films have been looked up so far.
        result:
          description: Set once the import has completed.
          allOf:
            - $ref: '#/components/schemas/ImportResult'
          nullable: true
        error:
          type: string
          nullable: true
          description: Set if the import has failed.

    ImportResult:
      type: object
      required:
        - diaryEntriesImported
        - diaryEntriesSkipped
        - watchlistItemsImported
        - watchlistItemsSkipped
        - manualMovies
        - failedFilms
        - warnings
      properties:
        diaryEntriesImported: { type: integer, format: int32 }
        diaryEntriesSkipped:
          type: integer
          format: int32
          description: Viewings that were in the diary already (same movie, same day), e.g. from an earlier import.
        watchlistItemsImported: { type: integer, format: int32 }
        watchlistItemsSkipped:
          type: integer
          format: int32
          description: Films that were on the watchlist already.
        manualMovies:
          type: array
          description: Films that TMDB does not know (or the server has no TMDB access), added as manual movies.
          items: { $ref: '#/components/schemas/ImportFilm' }
        failedFilms:
          type: array
          description: |
            Films that could not be looked up because TMDB failed. They were not imported,
            importing again retries them.
          items: { $ref: '#/components/schemas/ImportFilm' }
        warnings:
          type: array
          description: Rows of the export that were skipped, and why. Shortened if there are many.
          items: { type: string }

    ImportFilm:
      type: object
      required: [name]
      properties:
        name: { type: string }
        year: { type: integer, format: int32, nullable: true }
