<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Movie Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/" />
    <!-- The emoji as SVG for modern browsers, the .ico for the rest (and for requests to /favicon.ico). -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="48x48 32x32 16x16" href="favicon.ico" />
    <link rel="stylesheet" href="css/bulma.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="preload" id="webassembly" />
    <script type="importmap"></script>
  </head>
  <body>
    <div id="app">
      <section class="hero is-medium">
        <div class="hero-body has-text-centered">
          <p class="title is-1">🎬 Movie Tracker</p>
          <p class="subtitle">Loading…</p>
          <progress class="progress is-small is-primary mx-auto" max="100" style="max-width: 20rem"></progress>
        </div>
      </section>
    </div>

    <div id="blazor-error-ui">
      An unhandled error has occurred.
      <a href="." class="reload">Reload</a>
      <span class="dismiss" role="button" aria-label="Dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
  </body>
</html>
